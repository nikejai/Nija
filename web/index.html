<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!--
    CSP baseline for the web vault. Flutter CanvasKit and Material fonts load from
    gstatic.com unless you self-host them at build time. Mirror on your CDN/host.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com https://accounts.google.com https://apis.google.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://www.google.com wss: blob:; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://accounts.google.com; worker-src 'self' blob: https://www.gstatic.com; manifest-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="description" content="Your private, local-first digital vault.">
  <meta name="theme-color" content="#27272A">
  <meta name="google-signin-client_id" content="698262730675-ui2upcjqi4c3mpu8lm9ci3bv1okrbp2v.apps.googleusercontent.com">
  <link rel="privacy-policy" href="privacy.html">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nija">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nija</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Match app scaffold; Flutter replaces the body once the first frame renders. */
    html, body {
      background: #f4f4f5;
      height: 100%;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #27272a;
      }
    }
  </style>
</head>
<body>
  <script src="pwa_install.js"></script>
  <script src="webauthn_quick_unlock.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
