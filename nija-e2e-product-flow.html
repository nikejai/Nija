<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nija — End-to-End Product Flow</title>
<style>
:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f2f1f6;
  --surface-3:#e9e8ef;
  --line:#d5d4de;
  --text:#202126;
  --muted:#666873;
  --accent:#5967aa;
  --accent-2:#6b5df3;
  --accent-soft:#e2e6fb;
  --green:#2fa777;
  --red:#d55d66;
  --shadow:0 10px 28px rgba(48,49,66,.07);
}
html[data-theme="dark"]{
  --bg:#0b1118;
  --surface:#111923;
  --surface-2:#17212d;
  --surface-3:#202b38;
  --line:#2c3847;
  --text:#f7f8fb;
  --muted:#9da6b3;
  --accent:#8a80ff;
  --accent-2:#765cf4;
  --accent-soft:#292444;
  --green:#66c996;
  --red:#ef7b83;
  --shadow:0 12px 30px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.micro{
  font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}
.btn{
  min-height:44px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:10px;
  padding:0 14px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:white}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.icon-btn{
  width:44px;height:44px;
  display:grid;place-items:center;
  border:1px solid transparent;
  background:transparent;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line)}
.card{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px;
}
.input,.select,.textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  min-height:44px;
  padding:0 12px;
  outline:none;
}
.textarea{padding:12px;min-height:100px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.field{display:grid;gap:7px}
.field label{
  font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
}

/* ===== product entry ===== */
.entry-page{
  min-height:100vh;
  display:grid;
  grid-template-rows:64px 1fr;
}
.entry-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-weight:800;
}
.brand-mark{
  width:34px;height:34px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-2),#9b8fff);
  color:white;border-radius:10px;font-weight:900;
}
.entry-main{
  display:grid;
  place-items:center;
  padding:28px 16px 40px;
}
.entry-shell{
  width:min(100%,460px);
}
.hero{text-align:center;margin-bottom:26px}
.hero-logo{
  width:90px;height:90px;
  margin:0 auto 16px;
  border:1px solid var(--line);
  border-radius:24px;
  display:grid;place-items:center;
  background:var(--surface);
  box-shadow:var(--shadow);
  font-size:34px;
}
.hero h1{font-size:34px;margin:0;letter-spacing:-.045em}
.hero p{margin:10px auto 0;max-width:360px;color:var(--muted);line-height:1.55;font-size:14px}
.flow-card{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:16px;
  overflow:hidden;
}
.flow-option{
  width:100%;
  min-height:76px;
  display:grid;
  grid-template-columns:36px 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px 15px;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  text-align:left;
  cursor:pointer;
}
.flow-option:last-child{border-bottom:0}
.flow-option:hover{background:var(--surface-2)}
.flow-option .code{
  color:var(--accent);
  font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.flow-option strong{display:block;font-size:14px}
.flow-option small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.storage-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.storage-btn{
  min-height:44px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
}

/* ===== select vault ===== */
.vault-list{display:grid;gap:9px}
.vault-card{
  width:100%;
  min-height:86px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px;
  text-align:left;
  cursor:pointer;
}
.vault-card:hover{border-color:var(--accent)}
.vault-icon{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--accent-soft);
  color:var(--accent);
}
.vault-card strong{display:block;font-size:14px}
.vault-card small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

/* ===== unlock ===== */
.unlock-panel{text-align:center}
.guardian-icon{
  width:64px;height:64px;
  margin:0 auto 14px;
  border-radius:18px;
  background:var(--accent-soft);
  color:var(--accent);
  display:grid;place-items:center;
  font-size:26px;
}
.unlock-panel h2{margin:0;font-size:24px}
.unlock-panel p{color:var(--muted);font-size:12px;margin:8px 0 22px}
.unlock-actions{display:grid;gap:10px}

/* ===== app shell ===== */
.app-shell{min-height:100vh}
.mobile-top{
  position:sticky;top:0;z-index:40;
  height:58px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(12px);
}
.mobile-top .center{text-align:center;font-weight:800;font-size:14px}
.mobile-top .left{justify-self:start}
.mobile-top .right{justify-self:end;display:flex;gap:3px}
.app-content{
  width:min(100%,1160px);
  margin:0 auto;
  padding:18px 14px 108px;
}
.mobile-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  min-height:74px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(12px);
  display:grid;
  grid-template-columns:1fr 1fr 70px 1fr 1fr;
  align-items:end;
}
.mobile-nav a,.mobile-nav button{
  border:0;background:transparent;
  min-height:54px;
  display:grid;place-items:center;
  gap:3px;
  color:var(--muted);
  font-size:10px;
}
.mobile-nav a.active{color:var(--accent);font-weight:800}
.fab{
  width:54px;height:54px;
  border:0;border-radius:18px;
  background:var(--text);color:var(--bg);
  font-size:28px;
  margin-top:-20px;
  box-shadow:0 12px 26px rgba(0,0,0,.18);
  cursor:pointer;
}
.desktop-rail,.desktop-sidebar,.desktop-header{display:none}

/* ===== home ===== */
.home-brand-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:14px;margin-bottom:18px;
}
.home-brand-row h1{font-size:26px;margin:0;letter-spacing:-.045em}
.home-brand-row p{font-size:13px;line-height:1.45;margin:6px 0 0;color:var(--muted)}
.search-row{
  display:grid;
  grid-template-columns:1fr 48px;
  gap:8px;
  margin-bottom:16px;
}
.search-box{
  min-height:48px;
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:12px;
  display:flex;align-items:center;gap:10px;
  padding:0 13px;
}
.search-box input{border:0;background:transparent;outline:none;color:var(--text);width:100%}
.category-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
.category-card{
  min-height:116px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px;
  padding:14px;
  text-align:left;
  cursor:pointer;
}
.category-card strong{display:block;font-size:14px;margin-top:16px}
.category-card small{display:block;color:var(--muted);margin-top:4px}
.type-icon{
  width:36px;height:36px;
  display:grid;place-items:center;
  border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent);
  font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.section{margin-top:24px}
.section-head{
  display:flex;align-items:end;justify-content:space-between;gap:10px;
  margin-bottom:10px;
}
.section-head h2{font-size:19px;margin:0}
.text-link{border:0;background:transparent;color:var(--accent);font-weight:800;cursor:pointer;font-size:12px}
.item-list{display:grid;gap:8px}
.item-row{
  min-height:74px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:12px;
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:11px;
  align-items:center;
  padding:12px;
  cursor:pointer;
}
.item-row strong{display:block;font-size:13px}
.item-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

/* ===== all items ===== */
.filter-row{
  display:flex;gap:7px;overflow:auto;
  padding-bottom:4px;margin-bottom:10px;
}
.chip{
  white-space:nowrap;
  min-height:32px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:0 11px;
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  font-size:11px;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sort-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:10px}

/* ===== detail ===== */
.detail-screen .mobile-nav{display:none}
.detail-hero{text-align:center;padding:8px 0 18px}
.detail-hero .type-icon{width:58px;height:58px;margin:0 auto 10px;border-radius:16px}
.detail-hero h1{font-size:24px;margin:0 0 5px}
.detail-hero p{color:var(--muted);font-size:12px}
.detail-panel{overflow:hidden}
.detail-field{
  min-height:70px;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
}
.detail-field:last-child{border-bottom:0}
.detail-field label{
  display:block;
  color:var(--muted);
  font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:5px;
}
.detail-field strong{font-size:14px}
.detail-bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding:10px 12px max(10px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--surface);
}
.meta-toggle{
  width:100%;
  min-height:48px;
  margin-top:12px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:12px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  cursor:pointer;
  font-weight:800;
}
.meta-card{display:none;margin-top:10px}
.meta-card.open{display:block}
.meta-row{
  min-height:45px;
  display:grid;grid-template-columns:110px 1fr;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  font-size:11px;
}
.meta-row:last-child{border-bottom:0}
.meta-row span:first-child{color:var(--muted)}

/* ===== folders / settings ===== */
.folder-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.folder-card{
  min-height:122px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px;
  padding:14px;
  text-align:left;
  cursor:pointer;
}
.folder-card h3{font-size:15px;margin:24px 0 5px}
.folder-card p{font-size:11px;color:var(--muted);line-height:1.4}
.settings-group{margin-top:18px}
.settings-group:first-child{margin-top:0}
.settings-group h2{font-size:15px;color:var(--muted);margin:0 0 8px}
.setting-list{overflow:hidden}
.setting-row{
  min-height:72px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:42px 1fr auto;
  gap:12px;align-items:center;
}
.setting-row:last-child{border-bottom:0}
.setting-icon{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent-soft);
  color:var(--accent);
  display:grid;place-items:center;
  font-size:11px;
}
.setting-row strong{display:block;font-size:13px}
.setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}

/* ===== overlay ===== */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(18,20,25,.38);
  display:flex;align-items:flex-end;
}
.sheet{
  width:100%;
  max-height:92vh;overflow:auto;
  background:var(--surface);
  border-radius:20px 20px 0 0;
}
.sheet-handle{width:42px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 0}
.sheet-head{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;
}
.sheet-head h3{font-size:19px;margin:5px 0 0}
.sheet-body{padding:16px}
.sheet-foot{
  padding:12px 16px max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:8px;
}
.toast{
  position:fixed;right:16px;bottom:92px;z-index:120;
  background:var(--text);color:var(--bg);
  padding:11px 14px;border-radius:10px;
  font-size:12px;
}

/* ===== desktop ===== */
@media(min-width:760px){
  .mobile-top,.mobile-nav{display:none}
  .app-shell{
    display:grid;
    grid-template-columns:76px 220px 1fr;
  }
  .desktop-rail{
    display:flex;
    position:sticky;top:0;height:100vh;
    background:var(--surface);
    border-right:1px solid var(--line);
    flex-direction:column;align-items:center;justify-content:space-between;
    padding:18px 0;
  }
  .vertical{
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--muted);
  }
  .desktop-sidebar{
    display:flex;
    position:sticky;top:0;height:100vh;
    border-right:1px solid var(--line);
    background:var(--surface);
    flex-direction:column;
    padding:20px 12px;
  }
  .vault-label{
    padding:0 10px 16px;
    border-bottom:1px solid var(--line);
  }
  .vault-label strong{display:block;margin-top:7px}
  .vault-label small{display:block;color:var(--muted);margin-top:4px}
  .desktop-nav{display:grid;gap:4px;padding-top:14px}
  .desktop-nav a{
    min-height:42px;
    display:grid;
    grid-template-columns:28px 1fr;
    align-items:center;
    padding:0 10px;
    border:1px solid transparent;
    border-radius:10px;
    color:var(--muted);
    font-size:12px;
  }
  .desktop-nav a.active{background:var(--surface-2);border-color:var(--line);color:var(--text);font-weight:800}
  .desktop-nav .code{font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
  .desktop-header{
    display:flex;
    position:sticky;top:0;z-index:35;
    height:68px;
    align-items:center;justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .desktop-header h1{font-size:19px;margin:4px 0 0}
  .app-content{
    padding:24px;
    width:min(100%,1180px);
    margin:0;
  }
  .desktop-home{
    display:grid!important;
  }
  .mobile-home{display:none!important}
  .desktop-dashboard-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px
  }
  .desktop-dashboard-head h1{font-size:26px;margin:5px 0 5px}
  .desktop-dashboard-head p{margin:0;color:var(--muted);font-size:12px}
  .desktop-stats{
    display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px
  }
  .desktop-stat{
    min-height:88px;border:1px solid var(--line);background:var(--surface);
    border-radius:12px;padding:13px
  }
  .desktop-stat strong{display:block;font-size:22px}
  .desktop-stat small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
  .desktop-grid{
    display:grid;grid-template-columns:minmax(0,1.35fr) 300px;gap:14px
  }
  .desktop-panel{border:1px solid var(--line);background:var(--surface);border-radius:13px;overflow:hidden}
  .desktop-panel-head{min-height:50px;padding:0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .desktop-recent-row{
    min-height:64px;width:100%;
    display:grid;grid-template-columns:38px 1fr 130px 24px;gap:10px;align-items:center;
    padding:9px 13px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer
  }
  .desktop-recent-row:last-child{border-bottom:0}
  .desktop-recent-row:hover{background:var(--surface-2)}
  .quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
  .quick-grid button{
    min-height:72px;border:1px solid var(--line);background:var(--surface);
    border-radius:10px;cursor:pointer
  }
  .quick-grid button:hover{background:var(--surface-2)}
  .folder-grid{grid-template-columns:repeat(3,1fr)}
  .detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
  .meta-toggle{display:none}
  .meta-card{display:block;margin-top:0}
  .detail-bottom{position:static;border:0;padding:0;margin-top:12px;background:transparent}
  .overlay{align-items:center;justify-content:center;padding:24px}
  .sheet{width:min(620px,100%);border-radius:18px}
  .sheet-handle{display:none}
}
@media(min-width:760px) and (max-width:1050px){
  .desktop-stats{grid-template-columns:repeat(3,1fr)}
  .desktop-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>

<template id="sheet-template">
  <div class="overlay">
    <section class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <header class="sheet-head">
        <div><div class="micro" id="sheet-eyebrow"></div><h3 id="sheet-title"></h3></div>
        <button class="icon-btn" data-close>×</button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
      <footer class="sheet-foot" id="sheet-foot"></footer>
    </section>
  </div>
</template>

<script>
const app=document.getElementById('app');
const $=(q,r=document)=>r.querySelector(q);
const $$=(q,r=document)=>[...r.querySelectorAll(q)];

const state={
  theme:'light',
  selectedVault:null,
  unlocked:false,
  vaults:[
    {id:'v1',name:'Personal Vault',guardian:'Owl',items:12,modified:'Today · 9:41 PM',location:'This device'},
    {id:'v2',name:'Family Documents',guardian:'Lion',items:28,modified:'Yesterday',location:'External file'}
  ],
  folders:[
    {id:'f1',name:'Personal',count:5},
    {id:'f2',name:'Work',count:3},
    {id:'f3',name:'Finance',count:2},
    {id:'f4',name:'Travel',count:2}
  ],
  items:[

    {id:'i2',type:'Secure Note',title:'Recovery Phrase',subtitle:'Private recovery record',folder:'Personal',favorite:true,modified:'Today · 8:10 PM',notes:'summit aster breeze forge lantern onyx circle maple'},

function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function code(t){return ({Login:'LG','Secure Note':'NT',Identity:'ID',Card:'CC',Document:'DC'})[t]||'IT'}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function showSheet({eyebrow='',title,body,actions=[]}){
  const frag=document.getElementById('sheet-template').content.cloneNode(true);
  const overlay=$('.overlay',frag);
  $('#sheet-eyebrow',frag).textContent=eyebrow;
  $('#sheet-title',frag).textContent=title;
  $('#sheet-body',frag).innerHTML=body;
  const foot=$('#sheet-foot',frag);
  actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn '+(a.className||'');
    b.textContent=a.label;
    b.onclick=()=>a.onClick(overlay);
    foot.appendChild(b);
  });
  overlay.onclick=()=>overlay.remove();
  $('[data-close]',frag).onclick=()=>overlay.remove();
  document.body.appendChild(frag);
  return overlay;
}

    eyebrow:'Add item',
    title:type,
    body:`<div style="display:grid;gap:13px"><div class="field"><label>Title</label><input class="input" id="new-title"></div><div class="field"><label>Folder</label><select class="select">${state.folders.map(f=>`<option>${f.name}</option>`).join('')}</select></div><div class="field"><label>Primary value</label><input class="input" id="new-value"></div><div class="field"><label>Notes</label><textarea class="textarea"></textarea></div></div>`,
    actions:[{label:'Cancel',onClick:o=>o.remove()},{label:'Save',className:'primary',onClick:o=>{o.remove();toast('Item saved');go('items')}}]
  })
}

/* ===== render ===== */
function render(){
  document.documentElement.dataset.theme=state.theme;
  if(currentRoute==='entry')return renderEntry();
  if(currentRoute==='vault-select')return renderVaultSelect();
  if(currentRoute==='unlock')return renderUnlock();
  if(currentRoute==='home')return renderHome();
  if(currentRoute==='items')return renderItems(false);
  if(currentRoute==='favorites')return renderItems(true);
  if(currentRoute==='folders')return renderFolders();
  if(currentRoute==='settings')return renderSettings();
  if(currentRoute.startsWith('item/'))return renderDetail(currentRoute.split('/')[1]);
  renderEntry();
}
render();
</script>
</body>
</html>
